        content: `

            <li><strong>2. Research Paper:</strong> Complete ACL-format LaTeX paper in <code>paper/main.tex</code> and <code>paper/references.bib</code>.</li>
            <li><strong>3. Presentation:</strong> Interactive slide deck and Markdown transcript in <code>presentation/</code>.</li>

      },
      {
        title: "Conclusion & Future Work",
        subtitle: "Final Research Summary",
        content: `

      {

        subtitle: "Hate Speech Detection through Explainable AI and Reward Optimized LLMs",
        content: `
          <p style="font-size:16px; margin-top:32px;">Supervisor: <strong>Dr. Pradeepika Verma</strong></p>
          <p style="font-size:14px; color:var(--color-text-secondary); margin-top:8px;">Live Interactive Platform Running at <code>http://127.0.0.1:8000</code></p>

    ];

    let currentSlide = 0;
    const container = document.getElementById('slideContainer');
    const counter = document.getElementById('slideCounter');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    function renderSlide(index) {
      const s = slides[index];
      container.innerHTML = `
        <h1 style="margin-bottom:8px;">${s.title}</h1>
        <div style="font-size:13px; text-transform:uppercase; letter-spacing:0.08em; color:var(--color-text-tertiary); margin-bottom:24px;">${s.subtitle}</div>
        <div>${s.content}</div>
      `;
      counter.innerText = `Slide ${index + 1} of ${slides.length}`;
      prevBtn.disabled = index === 0;
      nextBtn.disabled = index === slides.length - 1;
    }

    prevBtn.addEventListener('click', () => { if (currentSlide > 0) { currentSlide--; renderSlide(currentSlide); } });
    nextBtn.addEventListener('click', () => { if (currentSlide < slides.length - 1) { currentSlide++; renderSlide(currentSlide); } });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') { if (currentSlide < slides.length - 1) { currentSlide++; renderSlide(currentSlide); } }
      if (e.key === 'ArrowLeft') { if (currentSlide > 0) { currentSlide--; renderSlide(currentSlide); } }
    });

    renderSlide(0);
  </script>
</body>
</html>
