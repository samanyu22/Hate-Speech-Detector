preprocessing:
  text:
    unicode_normalization: "NFKC"
    lowercase: false # preserve case markers often used for aggression in hate speech
    preserve_emojis: true
    preserve_hashtags: true
    preserve_mentions: true
    clean_urls: true
    max_length: 256
    strip_accents: false

  image:
    target_size: [224, 224]
    normalize_mean: [0.485, 0.456, 0.406]
    normalize_std: [0.229, 0.224, 0.225]
    ocr_engine: "easyocr"
    ocr_languages: ["en", "hi"]
    ocr_confidence_threshold: 0.35

  context:
    max_history_turns: 3
    max_char_length: 500
    mask_demographic_attributes: true

