app:
  name: "Multimodal Deepfake & Content Verification System"
  course: "CSET 346 - Natural Language Processing"
  instructor: "Dr. Sakshi"
  version: "1.0.0"
  env: "development"
  host: "127.0.0.1"
  port: 8000
  debug: true

hardware:
  device: "cpu" # 'cpu' or 'cuda' (auto-selected if available)
  num_workers: 4
  seed: 42

paths:
  data_dir: "data"
  models_dir: "models/checkpoints"
  reports_dir: "reports"
  uploads_dir: "data/uploads"
  manifests_dir: "data/manifests"
  benchmark_dir: "data/benchmark_300"

uncertainty:
  method: "entropy_and_margin" # 'entropy_and_margin', 'temperature_scaling', 'ensemble'
  confidence_threshold: 0.60 # Below this confidence, output UNCERTAIN
  entropy_threshold: 0.95 # Above this normalized entropy, output UNCERTAIN (near 50/50 confusion)
  cross_modal_mismatch_penalty: 0.25 # Penalty when semantic text-image cosine < threshold
  semantic_mismatch_threshold: 0.05 # Minimum acceptable semantic alignment

preprocessing:
  text:
    max_length: 128
    lowercase: true
    strip_accents: true
  vision:
    image_size: 224
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
    video_sample_fps: 1
    max_frames: 8
  audio:
    sample_rate: 16000
    n_mels: 64
    n_fft: 1024
    hop_length: 512
    max_duration_sec: 5.0

models:
  active_text_baseline: "text_tfidf_mlp"
  active_vision_baseline: "vision_resnet_classifier"
  active_audio_baseline: "audio_melspec_cnn"
  active_multimodal: "multimodal_cross_attention"
  learning_rate: 0.001
  batch_size: 16
  epochs: 10

