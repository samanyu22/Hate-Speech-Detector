[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hate-speech-detector"
version = "1.0.0"
description = "Hate Speech Detection through Explainable AI and Reward Optimized LLMs"
authors = [{ name = "Research Team", email = "research@antigravity.edu" }]
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.35.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "easyocr>=1.7.0",
    "pillow>=10.0.0",
    "pyyaml>=6.0.0"
]
readme = "README.md"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

